<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Business Card with HTML &amp; CSS 💼 | Modern Profile UI</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<article class="business-card">
  <div class="card-cover">
    <span class="brand-logo">WE</span>
    <span class="available-badge">Available for work</span>
  </div>

  <div class="profile-photo">
    <img
      src="https://i.pravatar.cc/200?img=12"
      alt="Saiful Islam Khan"
    >
    <span class="online-dot"></span>
  </div>

  <div class="card-content">
    <div class="profile-info">
      <h1>
        Saiful Islam Khan
        <span class="verified">✓</span>
      </h1>

      <p class="job-title">WordPress & Elementor Developer</p>
      <p class="location">⌖ Dhaka, Bangladesh</p>
    </div>

    <p class="bio">
      I build fast, responsive and conversion-focused WordPress websites
      for businesses around the world.
    </p>

    <div class="contact-grid">
      <a href="mailto:hello@example.com" class="contact-item">
        <span>✉</span>
        <div>
          <small>EMAIL</small>
          <strong>hello@example.com</strong>
        </div>
      </a>

      <a href="tel:+8801700000000" class="contact-item">
        <span>☎</span>
        <div>
          <small>PHONE</small>
          <strong>+880 1700 000000</strong>
        </div>
      </a>

      <a href="#" class="contact-item">
        <span>⌁</span>
        <div>
          <small>WEBSITE</small>
          <strong>webech.com</strong>
        </div>
      </a>
    </div>

    <div class="social-links">
      <a href="#" aria-label="LinkedIn">in</a>
      <a href="#" aria-label="Facebook">f</a>
      <a href="#" aria-label="GitHub">⌘</a>
      <a href="#" aria-label="Website">⌁</a>
    </div>

    <div class="card-actions">
      <button class="save-button" type="button">
        ＋ Save Contact
      </button>

      <button class="share-button" type="button" aria-label="Share profile">
        ↗
      </button>
    </div>
  </div>
</article>
</body>
</html>
